name: orga-alfiya
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Variable POSTGRES_DB requise}
      POSTGRES_USER: ${POSTGRES_USER:?Variable POSTGRES_USER requise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD requise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?SUPERADMIN_EMAIL requis}
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD:-}
      ORGA_PUBLIC_URL: ${ORGA_PUBLIC_URL:?ORGA_PUBLIC_URL requis}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      VAPID_PRIVATE_KEY_FILE: ${VAPID_PRIVATE_KEY_FILE:-/app/secrets/vapid_private.pem}
      VAPID_CONTACT: ${VAPID_CONTACT:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/database', timeout=4).read()"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./secrets:/app/secrets:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]

  notification-worker:
    build: ./apps/api
    command: ["python", "-m", "app.notification_worker_v7"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ORGA_PUBLIC_URL: ${ORGA_PUBLIC_URL:?ORGA_PUBLIC_URL requis}
      VAPID_PRIVATE_KEY_FILE: ${VAPID_PRIVATE_KEY_FILE:-/app/secrets/vapid_private.pem}
      VAPID_CONTACT: ${VAPID_CONTACT:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 30s
    ports:
      - "${ORGA_HTTP_BIND:-127.0.0.1}:${ORGA_HTTP_PORT:-8092}:80"
    networks: [backend]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

networks:
  backend:
    driver: bridge
volumes:
  pgdata:
  uploads:
