name: orga-alfiya
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Variable POSTGRES_DB requise}
      POSTGRES_USER: ${POSTGRES_USER:?Variable POSTGRES_USER requise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD requise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?SUPERADMIN_EMAIL requis}
      ORGA_PUBLIC_URL: ${ORGA_PUBLIC_URL:?ORGA_PUBLIC_URL requis}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${ORGA_HTTP_BIND:-127.0.0.1}:${ORGA_HTTP_PORT:-8092}:80"
    networks: [backend]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

networks:
  backend:
    driver: bridge
volumes:
  pgdata:
  uploads:
